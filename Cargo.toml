[workspace]
members = ["core", "platform/windows", "diagnostics"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["NetSight"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.37", features = ["bundled"] }
