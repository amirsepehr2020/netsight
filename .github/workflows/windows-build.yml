name: NETSIGHT Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Build NETSIGHT
        run: npm run tauri -- build --no-bundle
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NETSIGHT-Windows
          path: src-tauri/target/release/netsight.exe
