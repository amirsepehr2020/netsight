name: NetSight Windows Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'platform/**'
      - 'ui/**'
      - 'release/**'
      - 'branding/**'
      - '.github/workflows/release-windows.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          choco install imagemagick --yes --no-progress

      - name: Install Npcap SDK
        shell: powershell
        run: |
          $sdk = "$env:RUNNER_TEMP\npcap-sdk.zip"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile $sdk
          Expand-Archive -LiteralPath $sdk -DestinationPath "$env:RUNNER_TEMP\npcap-sdk" -Force
          $lib = Get-ChildItem "$env:RUNNER_TEMP\npcap-sdk" -Recurse -Filter wpcap.lib | Where-Object { $_.FullName -match '\\Lib\\x64\\' } | Select-Object -First 1
          if (-not $lib) { throw 'Npcap SDK x64 wpcap.lib not found' }
          $libDir = $lib.Directory.FullName
          "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBPCAP_LIBDIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPCAP_SDK_LIB=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Npcap SDK library: $libDir"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Build Windows binaries
        run: |
          cargo build --release --bin netsight-agent --bin netsight-desktop

      - name: Run release tests
        run: cargo test --workspace

      - name: Stage release payload
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\ui | Out-Null
          Copy-Item target\release\netsight-agent.exe dist\netsight-agent.exe
          Copy-Item target\release\netsight-desktop.exe dist\netsight-desktop.exe
          Copy-Item ui\* dist\ui\ -Recurse -Force
          Copy-Item release\install-prerequisites.ps1 dist\install-prerequisites.ps1
          magick convert branding\assets\netsight-app-icon.svg dist\netsight.ico

      - name: Build installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" release\NetSight.iss

      - name: Smoke-check release payload
        shell: powershell
        run: |
          if (-not (Test-Path dist\netsight-agent.exe)) { throw 'netsight-agent.exe missing' }
          if (-not (Test-Path dist\netsight-desktop.exe)) { throw 'netsight-desktop.exe missing' }
          if (-not (Test-Path dist\NetSight-Setup-*.exe)) { throw 'installer missing' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSight-Windows-1.0.0
          path: dist\NetSight-Setup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\NetSight-Setup-*.exe
          prerelease: false
          generate_release_notes: true
